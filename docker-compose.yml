services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: controle_rotina
      POSTGRES_USER: controle
      POSTGRES_PASSWORD: controle
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U controle -d controle_rotina"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/controle_rotina
      SPRING_DATASOURCE_USERNAME: controle
      SPRING_DATASOURCE_PASSWORD: controle
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend/frontend-web
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
