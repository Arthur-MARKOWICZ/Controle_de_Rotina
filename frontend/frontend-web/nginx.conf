# Prefixo novo de API? Espelhar em vite.config.ts e atualizar API_PROXY.md.
# Depois: docker compose up -d --build frontend
# Prefixos atuais: /usuarios /auth /me /tarefas /capacidades /planos
#
# Importante: só "restart" NÃO atualiza esta config — precisa --build.
# ^~ evita que a SPA (location /) capture paths da API.

upstream backend_api {
    server backend:8080;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Rota React da tela (singular) — NÃO confundir com /capacidades (API)
    location = /capacidade {
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
    }

    location ^~ /usuarios {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        proxy_intercept_errors on;
        error_page 502 503 504 = @api_upstream_error;
    }

    location ^~ /auth {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        proxy_intercept_errors on;
        error_page 502 503 504 = @api_upstream_error;
    }

    location ^~ /me {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        proxy_intercept_errors on;
        error_page 502 503 504 = @api_upstream_error;
    }

    location ^~ /tarefas {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        proxy_intercept_errors on;
        error_page 502 503 504 = @api_upstream_error;
    }

    location ^~ /capacidades {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        proxy_intercept_errors on;
        error_page 502 503 504 = @api_upstream_error;
    }

    location ^~ /planos {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        proxy_intercept_errors on;
        error_page 502 503 504 = @api_upstream_error;
    }

    location @api_upstream_error {
        default_type application/json;
        add_header Content-Type application/json always;
        add_header Cache-Control "no-store" always;
        return 502 '{"detail":"Backend indisponível. Aguarde e recarregue."}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
