# Prefixo novo de API? Espelhar em vite.config.ts e atualizar API_PROXY.md.
# Depois: docker compose up -d --build frontend
# Prefixos atuais: /usuarios /auth /me /tarefas /capacidades /planos /execucoes /historico/* /calendario
#
# Importante: só "restart" NÃO atualiza esta config — precisa --build.
# ^~ evita que a SPA (location /) capture paths da API.

upstream backend_api {
    server backend:8080;
}

# Rate limit de abuso (cadastro/login): 5 req/min por IP.
# Ver também app.rate-limit no backend (rede de segurança na porta 8080).
limit_req_zone $binary_remote_addr zone=auth_abuse:10m rate=5r/m;

# /calendario: SPA (Accept text/html) vs API GET (Accept application/json)
map $http_accept $calendario_api {
    default 0;
    ~*application/json 1;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    limit_req_status 429;

    # Rota React da tela (singular) — NÃO confundir com /capacidades (API)
    location = /capacidade {
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
    }

    # Tela React — NÃO confundir com /historico/dia e /historico/semana (API)
    location = /historico {
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
    }

    location = /calendario {
        error_page 418 = @calendario_api;
        if ($calendario_api = 1) {
            return 418;
        }
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
    }

    location @calendario_api {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        proxy_intercept_errors on;
        error_page 502 503 504 = @api_upstream_error;
    }

    location ^~ /usuarios {
        limit_req zone=auth_abuse;
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        proxy_intercept_errors on;
        error_page 502 503 504 = @api_upstream_error;
    }

    # Só login é limitado; /auth/refresh e /auth/logout ficam no bloco ^~ /auth abaixo.
    location = /auth/login {
        limit_req zone=auth_abuse;
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        proxy_intercept_errors on;
        error_page 502 503 504 = @api_upstream_error;
    }

    location ^~ /auth {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        proxy_intercept_errors on;
        error_page 502 503 504 = @api_upstream_error;
    }

    location ^~ /me {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        proxy_intercept_errors on;
        error_page 502 503 504 = @api_upstream_error;
    }

    location ^~ /tarefas {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        proxy_intercept_errors on;
        error_page 502 503 504 = @api_upstream_error;
    }

    location ^~ /capacidades {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        proxy_intercept_errors on;
        error_page 502 503 504 = @api_upstream_error;
    }

    location ^~ /planos {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        proxy_intercept_errors on;
        error_page 502 503 504 = @api_upstream_error;
    }

    location ^~ /execucoes {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        proxy_intercept_errors on;
        error_page 502 503 504 = @api_upstream_error;
    }

    location ^~ /historico/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        proxy_intercept_errors on;
        error_page 502 503 504 = @api_upstream_error;
    }

    location @api_upstream_error {
        default_type application/json;
        add_header Content-Type application/json always;
        add_header Cache-Control "no-store" always;
        return 502 '{"detail":"Backend indisponível. Aguarde e recarregue."}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
