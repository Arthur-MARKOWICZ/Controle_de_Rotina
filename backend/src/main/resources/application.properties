# Boot 4: show-components no YAML aninhado não liga na HealthEndpointProperties (campo herdado).
# Em .properties a ligação funciona; show-details permanece never (sem details sensíveis).
management.endpoint.health.show-components=always

# Contrato OpenAPI (ver contract/openapi.json). Fica em .properties porque src/test/resources/application.yml
# sobrepõe o application.yml principal nos testes; este arquivo vale nos dois.
springdoc.api-docs.version=openapi_3_1
springdoc.model-converters.java-nullable-property-customizer.enabled=true
