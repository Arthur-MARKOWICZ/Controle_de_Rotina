spring:
  application:
    name: controle-rotina
  cache:
    type: simple
    cache-names: accessTokenRevogados
  datasource:
    url: jdbc:postgresql://localhost:5432/controle_rotina
    username: controle
    password: controle
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
        one-indexed-parameters: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # show-components=always em application.properties (YAML aninhado não liga no Boot 4).
      show-details: never
      probes:
        enabled: true
  health:
    # Probe enxuto: DB + estados de disponibilidade (liveness/readiness).
    defaults:
      enabled: false
    db:
      enabled: true
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

app:
  rate-limit:
    # Proteção de abuso em POST /usuarios e POST /auth/login (por IP, janela de 1 min).
    enabled: true
    requests-per-minute: 5
  security:
    jwt:
      # Sem literal versionado. Local/dev: application-local.yml. Demais: APP_SECURITY_JWT_SECRET.
      secret: ${APP_SECURITY_JWT_SECRET:}
      access-token-ttl: 15m
      refresh-token-ttl: 5d
      issuer: controle-rotina
      audience: controle-rotina-api
    refresh-cookie:
      name: refresh_token
      path: /auth
      http-only: true
      secure: true
      same-site: Lax

