spring:
  application:
    name: controle-rotina
  datasource:
    url: jdbc:postgresql://localhost:5432/controle_rotina
    username: controle
    password: controle
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
        one-indexed-parameters: false

server:
  port: 8080

app:
  security:
    jwt:
      # Sem literal versionado. Local/dev: application-local.yml. Demais: APP_SECURITY_JWT_SECRET.
      secret: ${APP_SECURITY_JWT_SECRET:}
      access-token-ttl: 15m
      refresh-token-ttl: 5d
      issuer: controle-rotina
      audience: controle-rotina-api
    refresh-cookie:
      name: refresh_token
      path: /auth
      http-only: true
      secure: true
      same-site: Lax
