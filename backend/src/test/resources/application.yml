app:
  security:
    jwt:
      secret: controle-rotina-test-secret-key-min-32-chars!
      access-token-ttl: 15m
      refresh-token-ttl: 5d
      issuer: controle-rotina
      audience: controle-rotina-api
    refresh-cookie:
      name: refresh_token
      path: /auth
      http-only: true
      secure: false
      same-site: Lax
